# Every push to main updates a release pull request with the next version and its
# changelog, built from Conventional Commit messages (feat:, fix:, feat!:). Merging that
# pull request tags the version, publishes the GitHub release and attaches the installer
# and the portable executable, which is what AppStack's updater downloads.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis --no-progress -y }
          Add-Content $env:GITHUB_PATH $nsis
      - name: Build installer and portable executable
        run: .\scripts\package.ps1 -SkipChecks
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload $env:TAG dist\AppStackClassic-setup.exe dist\AppStackClassic-portable.exe --clobber
